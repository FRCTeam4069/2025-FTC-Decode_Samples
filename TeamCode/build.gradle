//
// TeamCode/build.gradle
// Minimal configuration for Limelight3A test
//

apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':FtcRobotController')
    implementation 'org.firstinspires.ftc:RobotCore:9.0.0'
    implementation 'org.firstinspires.ftc:Hardware:9.0.0'
    // If the Limelight3A API is not part of the SDK you have, you may need to add:
    // implementation 'com.qualcomm.hardware:limelightvision:<version>'
}
